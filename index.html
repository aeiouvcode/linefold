<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ece9df"><title>Linefold</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ece9df;color:#2d3030;font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:fixed;inset:0 0 auto 0;padding:max(15px,env(safe-area-inset-top)) 17px 0;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.brand{letter-spacing:.22em;font-size:10px;font-weight:700;color:#333b3a}.city{font:400 20px/1.1 Georgia,serif;letter-spacing:-.02em;margin-top:4px}.score{text-align:right}.week{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#67706c}.moved{font-size:20px;font-weight:650}.tray{position:fixed;left:50%;bottom:max(13px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:9px;align-items:center;padding:7px 9px;background:rgba(248,247,241,.88);backdrop-filter:blur(12px);border-radius:18px;box-shadow:0 3px 18px #39413c1d}.swatch{width:42px;height:42px;border:0;border-radius:13px;background:transparent;display:grid;place-items:center;padding:0}.swatch:after{content:"";width:25px;height:5px;border-radius:9px;background:var(--c);box-shadow:0 0 0 0 transparent;transition:.18s}.swatch.on{background:#fff;box-shadow:0 1px 7px #25312b18}.swatch.on:after{height:7px}.pause{position:fixed;right:16px;top:82px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.65);color:#3d4642;font-size:13px;box-shadow:0 1px 8px #25312b12}.hint{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:#fffdf7e8;padding:8px 13px;border-radius:16px;font-size:11px;color:#59615e;opacity:1;transition:opacity 1s;white-space:nowrap;pointer-events:none}.over{position:fixed;inset:0;background:#ece9dfee;display:none;place-items:center;text-align:center;padding:35px}.over.show{display:grid}.over h1{font:400 40px/1 Georgia,serif;margin:0 0 8px}.over p{font-size:13px;line-height:1.6;color:#5e6662;margin:0 0 20px}.over button{border:0;background:#343b38;color:white;border-radius:18px;padding:12px 20px;font-weight:650}.legend{position:fixed;left:15px;bottom:max(72px,calc(env(safe-area-inset-bottom) + 72px));font-size:10px;line-height:1.5;color:#6a726e;pointer-events:none}.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:#6f9c75;margin-right:5px;animation:pulse 1.8s infinite}@keyframes pulse{50%{opacity:.35}}
</style></head><body><canvas id="c"></canvas><div class="top"><div><div class="brand">LINEFOLD</div><div class="city">A small city, moving.</div></div><div class="score"><div class="week">week <span id="week">1</span></div><div class="moved"><span id="moved">0</span> moved</div></div></div><button class="pause" id="pause" aria-label="pause">Ⅱ</button><div class="hint" id="hint">Drag from one station to another</div><div class="legend"><span class="live"></span><span id="status">city growing</span></div><div class="tray" id="tray"></div><div class="over" id="over"><div><h1>The city outgrew you.</h1><p><span id="final"></span> passengers moved<br>before a station overflowed.</p><button id="again">Begin another city</button></div></div><script>
const C=document.getElementById('c'),x=C.getContext('2d'),D=Math.min(devicePixelRatio||1,2);let W,H,t=0,last=0,paused=false,ended=false,moved=0,week=1,selected=0,drag=null;const cols=['#e15b49','#3a83a6','#dfad3f','#6e9a61'];let stations=[],lines=[[],[],[],[]],trains=[],particles=[];const shapes=['circle','square','triangle','diamond'];
function size(){W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function rnd(a,b){return a+Math.random()*(b-a)}function station(px,py,shape){return{id:crypto.randomUUID?crypto.randomUUID():Math.random(),x:px,y:py,shape:shape||shapes[Math.floor(Math.random()*3)],pass:[],heat:0,born:t}}
function reset(){t=0;last=0;ended=false;paused=false;moved=0;week=1;stations=[];lines=[[],[],[],[]];trains=[];particles=[];const pts=[[.18,.34],[.43,.29],[.72,.38],[.29,.61],[.6,.63],[.82,.68]];pts.forEach((p,i)=>stations.push(station(W*p[0],H*p[1],shapes[i%3])));lines[0]=[stations[0],stations[1],stations[2]];lines[1]=[stations[3],stations[4],stations[5]];spawnTrain(0);spawnTrain(1);ui();document.getElementById('over').classList.remove('show');document.getElementById('hint').style.opacity=1;}
function spawnTrain(li){let L=lines[li];if(L.length>1)trains.push({li,seg:0,p:0,dir:1,load:[],cap:6})}
function ui(){document.getElementById('moved').textContent=moved;document.getElementById('week').textContent=week;document.getElementById('pause').textContent=paused?'▶':'Ⅱ';document.getElementById('status').textContent=paused?'city paused':'city growing'}
const tray=document.getElementById('tray');cols.forEach((c,i)=>{let b=document.createElement('button');b.className='swatch'+(!i?' on':'');b.style.setProperty('--c',c);b.onclick=()=>{selected=i;[...tray.children].forEach((q,j)=>q.classList.toggle('on',i===j))};tray.appendChild(b)});document.getElementById('pause').onclick=()=>{paused=!paused;ui()};document.getElementById('again').onclick=reset;
function nearest(px,py,r=34){let best=null,d=r;for(const s of stations){let n=Math.hypot(s.x-px,s.y-py);if(n<d){best=s;d=n}}return best}
function pos(e){let r=C.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return{x:q.clientX-r.left,y:q.clientY-r.top}}
function down(e){if(paused||ended)return;e.preventDefault();let p=pos(e),s=nearest(p.x,p.y);if(s){drag={start:s,pts:[s],x:p.x,y:p.y};document.getElementById('hint').style.opacity=0}}
function move(e){if(!drag)return;e.preventDefault();let p=pos(e);drag.x=p.x;drag.y=p.y;let s=nearest(p.x,p.y,29);if(s&&s!==drag.pts.at(-1)){if(!drag.pts.includes(s)||s===drag.start)drag.pts.push(s)}}
function up(e){if(!drag)return;e.preventDefault();let p=e.changedTouches?{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}:pos(e),s=nearest(p.x,p.y,38);if(s&&s!==drag.start){let path=drag.pts;if(path.at(-1)!==s)path.push(s);let existing=lines[selected];if(existing.length&&existing.at(-1)===path[0]) lines[selected]=existing.concat(path.slice(1));else if(existing.length&&existing[0]===path[0]) lines[selected]=path.slice().reverse().slice(0,-1).concat(existing);else lines[selected]=path;trains=trains.filter(q=>q.li!==selected);spawnTrain(selected);tone(220+selected*55,.05)}drag=null}
C.addEventListener('pointerdown',down);C.addEventListener('pointermove',move);C.addEventListener('pointerup',up);C.addEventListener('pointercancel',()=>drag=null);
let ac;function tone(f,d){try{ac=ac||new(AudioContext);let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.025,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch{}}
function spawnPassenger(){if(!stations.length)return;let s=stations[Math.floor(Math.random()*stations.length)],choices=shapes.filter(z=>z!==s.shape);if(s.pass.length<9)s.pass.push(choices[Math.floor(Math.random()*choices.length)])}
function grow(){let margin=55,tries=30;while(tries--){let px=rnd(margin,W-margin),py=rnd(130,H-115);if(stations.every(s=>Math.hypot(s.x-px,s.y-py)>72)){stations.push(station(px,py));particles.push({x:px,y:py,a:1});tone(300,.08);break}}}
function pathPoint(L,seg,p){let a=L[seg],b=L[seg+1];return{x:a.x+(b.x-a.x)*p,y:a.y+(b.y-a.y)*p}}
function update(dt){t+=dt;if(Math.floor(t/22)+1>week){week++;grow();if(week%2===0){for(let i=0;i<lines.length;i++)if(lines[i].length>2)spawnTrain(i)}ui()}if(Math.floor(t*1.28)!==Math.floor((t-dt)*1.28))spawnPassenger();for(const tr of trains){let L=lines[tr.li];if(L.length<2)continue;tr.seg=Math.min(tr.seg,L.length-2);tr.p+=dt*.18*tr.dir;if(tr.p>=1||tr.p<=0){let at=tr.p>=1?L[tr.seg+1]:L[tr.seg];tr.p=tr.p>=1?1:0;for(let i=at.pass.length-1;i>=0;i--){if(at.pass[i]===at.shape&&tr.load.length<tr.cap){tr.load.push(at.pass.splice(i,1)[0])}}for(let i=tr.load.length-1;i>=0;i--){if(tr.load[i]===at.shape){tr.load.splice(i,1);moved++;particles.push({x:at.x,y:at.y,a:1});ui()}}if(tr.p>=1){if(tr.seg<L.length-2){tr.seg++;tr.p=0}else tr.dir=-1}else{if(tr.seg>0){tr.seg--;tr.p=1}else tr.dir=1}}}for(const s of stations){s.heat+=(s.pass.length>=7?dt:-dt*1.8);s.heat=Math.max(0,s.heat);if(s.heat>7){ended=true;document.getElementById('final').textContent=moved;document.getElementById('over').classList.add('show');tone(105,.7)}}particles.forEach(p=>{p.a-=dt*.8});particles=particles.filter(p=>p.a>0)}
function shape(s,xx,yy,r,fill=true){x.beginPath();if(s==='circle')x.arc(xx,yy,r,0,Math.PI*2);else if(s==='square')x.rect(xx-r,yy-r,r*2,r*2);else if(s==='triangle'){x.moveTo(xx,yy-r*1.25);x.lineTo(xx+r*1.15,yy+r);x.lineTo(xx-r*1.15,yy+r);x.closePath()}else{x.moveTo(xx,yy-r*1.3);x.lineTo(xx+r*1.05,yy);x.lineTo(xx,yy+r*1.3);x.lineTo(xx-r*1.05,yy);x.closePath()}fill?x.fill():x.stroke()}
function river(){x.strokeStyle='#d6e5e0';x.lineWidth=24;x.lineCap='round';x.beginPath();x.moveTo(-20,H*.56);x.bezierCurveTo(W*.18,H*.44,W*.35,H*.76,W*.57,H*.51);x.bezierCurveTo(W*.75,H*.31,W*.88,H*.55,W+20,H*.43);x.stroke();x.strokeStyle='#e3efeb';x.lineWidth=16;x.stroke()}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#ece9df';x.fillRect(0,0,W,H);river();x.strokeStyle='#d9d7ce';x.lineWidth=1;x.setLineDash([2,7]);for(let i=0;i<7;i++){x.beginPath();x.moveTo(0,125+i*(H-210)/7);x.lineTo(W,105+i*(H-190)/7);x.stroke()}x.setLineDash([]);for(let li=0;li<lines.length;li++){let L=lines[li];if(L.length<2)continue;x.strokeStyle='#ece9df';x.lineWidth=10;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(L[0].x,L[0].y);L.slice(1).forEach(s=>x.lineTo(s.x,s.y));x.stroke();x.strokeStyle=cols[li];x.lineWidth=6;x.stroke()}if(drag){x.strokeStyle=cols[selected];x.lineWidth=5;x.lineCap='round';x.setLineDash([8,7]);x.beginPath();x.moveTo(drag.start.x,drag.start.y);drag.pts.slice(1).forEach(s=>x.lineTo(s.x,s.y));x.lineTo(drag.x,drag.y);x.stroke();x.setLineDash([])}for(const s of stations){if(s.heat>0){x.fillStyle=`rgba(218,76,67,${Math.min(.22,s.heat/25)})`;x.beginPath();x.arc(s.x,s.y,22+s.heat,0,7);x.fill()}x.fillStyle='#f8f6ef';x.strokeStyle=s.heat>3?'#d64b43':'#303838';x.lineWidth=2.3;shape(s.shape,s.x,s.y,10,true);shape(s.shape,s.x,s.y,10,false);s.pass.forEach((p,i)=>{let row=Math.floor(i/4),col=i%4,px=s.x-12+col*8,py=s.y+19+row*8;x.fillStyle='#4a5350';shape(p,px,py,2.3,true)})}for(const tr of trains){let L=lines[tr.li];if(L.length<2)continue;let p=pathPoint(L,tr.seg,tr.p);x.save();let a=L[tr.seg],b=L[tr.seg+1],ang=Math.atan2(b.y-a.y,b.x-a.x);x.translate(p.x,p.y);x.rotate(ang);x.fillStyle='#fffdf6';x.strokeStyle='#29312f';x.lineWidth=1.6;x.beginPath();x.roundRect(-11,-6,22,12,4);x.fill();x.stroke();x.fillStyle=cols[tr.li];x.fillRect(-6,-2,12,4);x.restore()}particles.forEach(p=>{x.strokeStyle=`rgba(78,110,91,${p.a})`;x.lineWidth=1.5;x.beginPath();x.arc(p.x,p.y,12+(1-p.a)*22,0,7);x.stroke()})}
function loop(ms){let n=ms/1000,dt=Math.min(.04,n-last||0);last=n;if(!paused&&!ended)update(dt);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
