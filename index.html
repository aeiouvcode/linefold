<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ece9df"><title>Linefold</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ece9df;color:#2d3030;font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:fixed;inset:0 0 auto 0;padding:max(15px,env(safe-area-inset-top)) 17px 0;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.brand{letter-spacing:.22em;font-size:10px;font-weight:700;color:#333b3a}.city{font:400 20px/1.1 Georgia,serif;letter-spacing:-.02em;margin-top:4px}.score{text-align:right}.week{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#67706c}.moved{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}.tray{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:14px;align-items:center;padding:0}.swatch{width:42px;height:42px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;padding:0}.swatch:after{content:"";width:25px;height:5px;border-radius:9px;background:var(--c);box-shadow:0 0 0 0 transparent;transition:height .28s cubic-bezier(.2,1.5,.4,1),transform .28s cubic-bezier(.2,1.5,.4,1),box-shadow .2s}.swatch:active:after{transform:scale(.82)}.swatch.on{background:rgba(255,255,255,.72);box-shadow:0 1px 0 #fff inset,0 2px 8px #4b524b17}.swatch.on:after{height:7px;transform:scaleX(1.08);box-shadow:0 3px 8px color-mix(in srgb,var(--c) 28%,transparent)}.pause{position:fixed;right:12px;top:72px;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#59615d;font-size:12px;transition:transform .22s cubic-bezier(.2,1.5,.4,1),background .2s}.pause:active{transform:scale(.78);background:rgba(255,255,255,.5)}.hint{position:fixed;left:17px;top:82px;font-size:10px;letter-spacing:.03em;color:#747c78;opacity:1;transition:opacity 1s;white-space:nowrap;pointer-events:none}.over{position:fixed;inset:0;background:#ece9dfee;display:none;place-items:center;text-align:center;padding:35px}.over.show{display:grid}.over h1{font:400 40px/1 Georgia,serif;margin:0 0 8px}.over p{font-size:13px;line-height:1.6;color:#5e6662;margin:0 0 20px}.over button{border:0;background:#343b38;color:white;border-radius:18px;padding:12px 20px;font-weight:650}.upgrade{position:fixed;inset:0;background:rgba(236,233,223,.96);display:none;align-items:end;padding:0 24px max(26px,env(safe-area-inset-bottom));z-index:8}.upgrade.show{display:grid}.upgrade-card{width:100%;max-width:390px;margin:0 auto;text-align:left}.upgrade h2{font:400 34px/1.05 Georgia,serif;margin:0 0 6px;letter-spacing:-.025em}.upgrade p{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#747b77;margin:0 0 20px}.choices{border-top:1px solid #c9c8c0}.choice{width:100%;border:0;border-bottom:1px solid #c9c8c0;background:transparent;padding:14px 0;text-align:left;color:#323937}.choice{transition:transform .22s cubic-bezier(.2,1.4,.4,1),color .2s}.choice:active{transform:translateX(7px);color:#b65442}.choice b{display:block;font-size:14px;font-weight:650}.choice span{font-size:11px;color:#737a76}.resources{position:fixed;right:17px;top:126px;text-align:right;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#7a817d;line-height:1.65}.resources b{color:#3d4541;font-weight:700}.legend{position:fixed;left:15px;bottom:max(72px,calc(env(safe-area-inset-bottom) + 72px));font-size:10px;line-height:1.5;color:#6a726e;pointer-events:none}.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:#6f9c75;margin-right:5px;animation:pulse 1.8s infinite}.secret{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);font:italic 11px Georgia,serif;color:#6e7772;opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap}.secret.show{opacity:1}@keyframes pulse{50%{opacity:.35}}
</style></head><body><canvas id="c"></canvas><div class="top"><div><div class="brand">LINEFOLD</div><div class="city">A small city, moving.</div></div><div class="score"><div class="week">week <span id="week">1</span></div><div class="moved"><span id="moved">0</span> moved</div></div></div><button class="pause" id="pause" aria-label="pause">Ⅱ</button><div class="hint" id="hint">Drag from one station to another</div><div class="secret" id="secret">A little ferry joined the morning run.</div><div class="resources"><b id="day">MON</b><br><span id="tunnels">2 tunnels</span></div><div class="legend"><span class="live"></span><span id="status">city growing</span></div><div class="tray" id="tray"></div><div class="over" id="over"><div><h1>The city outgrew you.</h1><p><span id="final"></span> passengers moved<br>before a station overflowed.</p><button id="again">Begin another city</button></div></div><div class="upgrade" id="upgrade"><div class="upgrade-card"><h2>A new week.</h2><p>Choose what the city receives.</p><div class="choices"><button class="choice" data-up="car"><b>Carriage</b><span>Every train carries two more passengers.</span></button><button class="choice" data-up="engine"><b>Locomotive</b><span>Add a train to the busiest line.</span></button><button class="choice" data-up="hub"><b>Interchange</b><span>The busiest station tolerates more crowding.</span></button><button class="choice" data-up="tunnel"><b>Tunnels</b><span>Gain two more river crossings.</span></button></div></div></div><script>
const C=document.getElementById('c'),x=C.getContext('2d'),D=Math.min(devicePixelRatio||1,2);let W,H,t=0,last=0,paused=false,ended=false,moved=0,week=1,selected=0,drag=null;const cols=['#e15b49','#3a83a6','#dfad3f','#6e9a61'];let stations=[],lines=[[],[],[],[]],trains=[],particles=[];const shapes=['circle','square','triangle','diamond'];const days=['MON','TUE','WED','THU','FRI','SAT','SUN'];let capBonus=0,hub=null,hubBonus=0,tunnels=2,riverTaps=0,ferry=false;
function size(){W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function rnd(a,b){return a+Math.random()*(b-a)}function station(px,py,shape){return{id:crypto.randomUUID?crypto.randomUUID():Math.random(),x:px,y:py,shape:shape||shapes[Math.floor(Math.random()*3)],pass:[],heat:0,born:t}}
function reset(){t=0;last=0;ended=false;paused=false;moved=0;week=1;capBonus=0;hub=null;hubBonus=0;tunnels=2;riverTaps=0;ferry=false;stations=[];lines=[[],[],[],[]];trains=[];particles=[];const pts=[[.18,.28],[.55,.27],[.84,.35],[.17,.54],[.55,.56],[.83,.65]];pts.forEach((p,i)=>stations.push(station(W*p[0],H*p[1],shapes[i%3])));lines[0]=[stations[0],stations[1],stations[2]];lines[1]=[stations[3],stations[4],stations[5]];spawnTrain(0);spawnTrain(1);ui();document.getElementById('over').classList.remove('show');document.getElementById('hint').style.opacity=1;}
function spawnTrain(li){let L=lines[li];if(L.length>1)trains.push({li,seg:0,p:0,dir:1,load:[],cap:6+capBonus})}
function ui(){document.getElementById('moved').textContent=moved;document.getElementById('day').textContent=days[Math.floor((t%22)/22*7)%7];document.getElementById('tunnels').textContent=tunnels+' tunnel'+(tunnels===1?'':'s');document.getElementById('week').textContent=week;document.getElementById('pause').textContent=paused?'▶':'Ⅱ';document.getElementById('status').textContent=paused?'city paused':'city growing'}
const tray=document.getElementById('tray');cols.forEach((c,i)=>{let b=document.createElement('button');b.className='swatch'+(!i?' on':'');b.style.setProperty('--c',c);b.onclick=()=>{selected=i;[...tray.children].forEach((q,j)=>q.classList.toggle('on',i===j))};tray.appendChild(b)});document.getElementById('pause').onclick=()=>{paused=!paused;ui()};document.getElementById('again').onclick=reset;document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let u=b.dataset.up;if(u==='car'){capBonus+=2;trains.forEach(q=>q.cap+=2)}else if(u==='engine'){let li=lines.map((l,i)=>({i,n:l.length})).sort((a,b)=>b.n-a.n)[0].i;spawnTrain(li)}else if(u==='hub'){hub=stations.slice().sort((a,b)=>b.pass.length-a.pass.length)[0];hubBonus+=5}else if(u==='tunnel'){tunnels+=2}document.getElementById('upgrade').classList.remove('show');paused=false;ui();tone(390,.12)});
function crossesRiver(a,b){let ya=a.y-H*.54,yb=b.y-H*.54;return ya*yb<0&&Math.abs(a.x-b.x)>35}function nearest(px,py,r=34){let best=null,d=r;for(const s of stations){let n=Math.hypot(s.x-px,s.y-py);if(n<d){best=s;d=n}}return best}
function pos(e){let r=C.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return{x:q.clientX-r.left,y:q.clientY-r.top}}
function down(e){if(paused||ended)return;e.preventDefault();let p=pos(e),s=nearest(p.x,p.y);if(!s&&Math.abs(p.y-H*.54)<38){riverTaps++;if(riverTaps===5){ferry=true;document.getElementById('secret').classList.add('show');setTimeout(()=>document.getElementById('secret').classList.remove('show'),2600);tone(440,.18)}}if(s){drag={start:s,pts:[s],x:p.x,y:p.y};document.getElementById('hint').style.opacity=0}}
function move(e){if(!drag)return;e.preventDefault();let p=pos(e);drag.x=p.x;drag.y=p.y;let s=nearest(p.x,p.y,29);if(s&&s!==drag.pts.at(-1)){if(!drag.pts.includes(s)||s===drag.start)drag.pts.push(s)}}
function up(e){if(!drag)return;e.preventDefault();let p=e.changedTouches?{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}:pos(e),s=nearest(p.x,p.y,38);if(s&&s!==drag.start){let path=drag.pts;if(path.at(-1)!==s)path.push(s);let need=0;for(let i=0;i<path.length-1;i++)if(crossesRiver(path[i],path[i+1]))need++;if(need>tunnels){tone(95,.18);particles.push({x:s.x,y:s.y,a:1});drag=null;return}tunnels-=need;ui();let existing=lines[selected];if(existing.length&&existing.at(-1)===path[0]) lines[selected]=existing.concat(path.slice(1));else if(existing.length&&existing[0]===path[0]) lines[selected]=path.slice().reverse().slice(0,-1).concat(existing);else if(existing.includes(path[0])){let k=existing.indexOf(path[0]),end=path.at(-1),j=existing.indexOf(end);if(j>=0&&j!==k){let a=Math.min(k,j),b=Math.max(k,j),mid=k<j?path:path.slice().reverse();lines[selected]=existing.slice(0,a).concat(mid,existing.slice(b+1))}else lines[selected]=existing.slice(0,k+1).concat(path.slice(1))}else lines[selected]=path;trains=trains.filter(q=>q.li!==selected);spawnTrain(selected);tone(220+selected*55,.05)}drag=null}
C.addEventListener('pointerdown',down);C.addEventListener('pointermove',move);C.addEventListener('pointerup',up);C.addEventListener('pointercancel',()=>drag=null);
let ac;function tone(f,d){try{ac=ac||new(AudioContext);let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.025,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch{}}
function spawnPassenger(){if(!stations.length)return;let s=stations[Math.floor(Math.random()*stations.length)],choices=shapes.filter(z=>z!==s.shape);if(s.pass.length<9)s.pass.push(choices[Math.floor(Math.random()*choices.length)])}
function grow(){let margin=55,tries=30;while(tries--){let px=rnd(margin,W-margin),py=rnd(130,H-115);if(stations.every(s=>Math.hypot(s.x-px,s.y-py)>72)){stations.push(station(px,py));particles.push({x:px,y:py,a:1});tone(300,.08);break}}}
function pathPoint(L,seg,p){let a=L[seg],b=L[seg+1];return{x:a.x+(b.x-a.x)*p,y:a.y+(b.y-a.y)*p}}
function update(dt){t+=dt;ui();if(Math.floor(t/22)+1>week){week++;grow();paused=true;document.getElementById('upgrade').classList.add('show');ui()}if(Math.floor(t*1.28)!==Math.floor((t-dt)*1.28))spawnPassenger();for(const tr of trains){let L=lines[tr.li];if(L.length<2)continue;tr.seg=Math.min(tr.seg,L.length-2);tr.p+=dt*.18*tr.dir;if(tr.p>=1||tr.p<=0){let at=tr.p>=1?L[tr.seg+1]:L[tr.seg];tr.p=tr.p>=1?1:0;for(let i=at.pass.length-1;i>=0;i--){if(at.pass[i]===at.shape&&tr.load.length<tr.cap){tr.load.push(at.pass.splice(i,1)[0])}}for(let i=tr.load.length-1;i>=0;i--){if(tr.load[i]===at.shape){tr.load.splice(i,1);moved++;particles.push({x:at.x,y:at.y,a:1});ui()}}if(tr.p>=1){if(tr.seg<L.length-2){tr.seg++;tr.p=0}else tr.dir=-1}else{if(tr.seg>0){tr.seg--;tr.p=1}else tr.dir=1}}}for(const s of stations){s.heat+=(s.pass.length>=7?dt:-dt*1.8);s.heat=Math.max(0,s.heat);if(s.heat>(s===hub?7+hubBonus:7)){ended=true;document.getElementById('final').textContent=moved;document.getElementById('over').classList.add('show');tone(105,.7)}}particles.forEach(p=>{p.a-=dt*.8});particles=particles.filter(p=>p.a>0)}
function shape(s,xx,yy,r,fill=true){x.beginPath();if(s==='circle')x.arc(xx,yy,r,0,Math.PI*2);else if(s==='square')x.rect(xx-r,yy-r,r*2,r*2);else if(s==='triangle'){x.moveTo(xx,yy-r*1.25);x.lineTo(xx+r*1.15,yy+r);x.lineTo(xx-r*1.15,yy+r);x.closePath()}else{x.moveTo(xx,yy-r*1.3);x.lineTo(xx+r*1.05,yy);x.lineTo(xx,yy+r*1.3);x.lineTo(xx-r*1.05,yy);x.closePath()}fill?x.fill():x.stroke()}
function riverPath(){x.beginPath();x.moveTo(-20,H*.59);x.bezierCurveTo(W*.19,H*.47,W*.36,H*.72,W*.58,H*.50);x.bezierCurveTo(W*.77,H*.32,W*.88,H*.54,W+20,H*.43)}function river(){x.lineCap='round';x.strokeStyle='rgba(77,99,93,.10)';x.lineWidth=31;riverPath();x.stroke();x.strokeStyle='#cbded9';x.lineWidth=27;riverPath();x.stroke();x.strokeStyle='#dcebe7';x.lineWidth=20;riverPath();x.stroke();x.strokeStyle='rgba(255,255,255,.62)';x.lineWidth=2;riverPath();x.stroke()}function ground(){let g=x.createRadialGradient(W*.23,H*.31,8,W*.23,H*.31,W*.46);g.addColorStop(0,'rgba(255,255,255,.34)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,92,W,H-150);x.strokeStyle='rgba(116,113,99,.08)';x.lineWidth=1;for(let i=0;i<4;i++){x.beginPath();x.ellipse(W*(.18+i*.23),H*(.29+(i%2)*.39),46+i*9,24+i*4,-.2,0,Math.PI*2);x.stroke()}}
function ferryBoat(){if(!ferry)return;let fx=((t*13)%(W+50))-25,fy=H*.54+Math.sin(t*.8)*10;x.save();x.translate(fx,fy);x.fillStyle='rgba(58,68,64,.12)';x.beginPath();x.ellipse(1,7,11,3,0,0,7);x.fill();x.fillStyle='#f6f1e7';x.strokeStyle='#7f6b56';x.lineWidth=1;x.beginPath();x.moveTo(-8,0);x.lineTo(8,0);x.lineTo(5,5);x.lineTo(-5,5);x.closePath();x.fill();x.stroke();x.fillStyle='#9e684c';x.fillRect(-2,-5,4,5);x.restore()}function draw(){x.clearRect(0,0,W,H);x.fillStyle='#ece9df';x.fillRect(0,0,W,H);ground();river();ferryBoat();x.strokeStyle='#d9d7ce';x.lineWidth=1;x.setLineDash([2,7]);for(let i=0;i<7;i++){x.beginPath();x.moveTo(0,125+i*(H-210)/7);x.lineTo(W,105+i*(H-190)/7);x.stroke()}x.setLineDash([]);for(let li=0;li<lines.length;li++){let L=lines[li];if(L.length<2)continue;x.lineCap='round';x.lineJoin='round';x.strokeStyle='rgba(61,65,60,.13)';x.lineWidth=12;x.beginPath();x.moveTo(L[0].x,L[0].y+2);L.slice(1).forEach(s=>x.lineTo(s.x,s.y+2));x.stroke();x.strokeStyle='#f2efe6';x.lineWidth=10;x.beginPath();x.moveTo(L[0].x,L[0].y);L.slice(1).forEach(s=>x.lineTo(s.x,s.y));x.stroke();x.strokeStyle=cols[li];x.lineWidth=6;x.stroke()}if(drag){x.strokeStyle=cols[selected];x.lineWidth=5;x.lineCap='round';x.setLineDash([8,7]);x.beginPath();x.moveTo(drag.start.x,drag.start.y);drag.pts.slice(1).forEach(s=>x.lineTo(s.x,s.y));x.lineTo(drag.x,drag.y);x.stroke();x.setLineDash([])}for(const s of stations){let age=Math.max(0,t-s.born),ss=age<.45?1+(1-age/.45)*-.32:1;x.save();x.translate(s.x,s.y);x.scale(ss,ss);x.translate(-s.x,-s.y);if(s===hub){x.strokeStyle='#7d684d';x.lineWidth=2;x.beginPath();x.arc(s.x,s.y,16,0,7);x.stroke()}x.fillStyle='rgba(54,60,56,.16)';x.beginPath();x.ellipse(s.x+1,s.y+3,13,7,0,0,7);x.fill();if(s.heat>0){x.fillStyle=`rgba(218,76,67,${Math.min(.22,s.heat/25)})`;x.beginPath();x.arc(s.x,s.y,22+s.heat,0,7);x.fill()}x.fillStyle='#f8f6ef';x.strokeStyle=s.heat>3?'#d64b43':'#303838';x.lineWidth=2.3;shape(s.shape,s.x,s.y,10,true);shape(s.shape,s.x,s.y,10,false);x.save();x.globalAlpha=.55;x.strokeStyle='#fff';x.lineWidth=1;x.beginPath();x.arc(s.x-2,s.y-2,5.8,3.65,5.75);x.stroke();x.restore();s.pass.forEach((p,i)=>{let row=Math.floor(i/4),col=i%4,px=s.x-12+col*8,py=s.y+19+row*8;x.fillStyle='#4a5350';shape(p,px,py,2.3,true)});x.restore()}for(const tr of trains){let L=lines[tr.li];if(L.length<2)continue;let p=pathPoint(L,tr.seg,tr.p);x.save();let a=L[tr.seg],b=L[tr.seg+1],ang=Math.atan2(b.y-a.y,b.x-a.x);x.translate(p.x,p.y);x.rotate(ang);x.fillStyle='rgba(45,51,48,.18)';x.beginPath();x.roundRect(-10,-4,22,12,4);x.fill();x.fillStyle='#fffdf6';x.strokeStyle='#29312f';x.lineWidth=1.4;x.beginPath();x.roundRect(-11,-7,22,12,4);x.fill();x.stroke();x.fillStyle=cols[tr.li];x.fillRect(-6,-3,12,4);x.fillStyle='rgba(255,255,255,.8)';x.fillRect(-5,-3,4,1);x.restore()}particles.forEach(p=>{x.strokeStyle=`rgba(78,110,91,${p.a})`;x.lineWidth=1.5;x.beginPath();x.arc(p.x,p.y,12+(1-Math.pow(p.a,2))*22,0,7);x.stroke()})}
function loop(ms){let n=ms/1000,dt=Math.min(.04,n-last||0);last=n;if(!paused&&!ended)update(dt);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
