</style></head><body><canvas id="c"></canvas><div class="top"><div><div class="brand">LINEFOLD</div><div class="city">A small city, moving.</div><div class="hint" id="hint">Drag from one station to another</div></div><div class="score"><div class="meta"><div class="day"><span id="day">MON</span> · WK <span id="week">1</span></div><div class="moved"><span id="moved">0</span></div><div class="sub">moved</div></div><div class="clock"><i id="hand"></i></div></div></div><button class="pause" id="pause" aria-label="pause">Ⅱ</button><div class="secret" id="secret">A little ferry joined the morning run.</div><div class="tun" aria-label="tunnels left"><svg width="22" height="12" viewBox="0 0 22 12"><path d="M2 11V7a9 6 0 0 1 18 0v4" fill="none" stroke="#2c3331" stroke-width="2.4"/></svg><span id="tunnels">2</span></div><div class="tray" id="tray"></div><div class="over" id="over"><div><h1>The city outgrew you.</h1><p><span id="final"></span> passengers moved<br>before a station overflowed.</p><button id="again">Begin another city</button></div></div><div class="upgrade" id="upgrade"><div class="upgrade-card"><h2>A new week.</h2><p>Choose what the city receives.</p><div class="choices"><button class="choice" data-up="car"><b>Carriage</b><span>Every train carries two more passengers.</span></button><button class="choice" data-up="engine"><b>Locomotive</b><span>Add a train to the busiest line.</span></button><button class="choice" data-up="hub"><b>Interchange</b><span>The busiest station tolerates more crowding.</span></button><button class="choice" data-up="tunnel"><b>Tunnels</b><span>Gain two more river crossings.</span></button></div></div></div><script>const C=document.getElementById('c'),x=C.getContext('2d'),D=Math.min(devicePixelRatio||1,2);let W,H,R=11,LW=8,BX=0,BW=0,t=0,last=0,paused=false,ended=false,moved=0,week=1,selected=0,drag=null;const cols=['#e15b49','#2f7fa8','#e3a92f','#5f9a5a'];let stations=[],lines=[[],[],[],[]],trains=[],particles=[];const shapes=['circle','square','triangle','diamond'];const days=['MON','TUE','WED','THU','FRI','SAT','SUN'];let capBonus=0,hub=null,hubBonus=0,tunnels=2,riverTaps=0,ferry=false;
function size(){W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;x.setTransform(D,0,0,D,0,0);R=Math.max(10,Math.min(15,Math.min(W,H)*.03));LW=R*.74;BW=Math.min(W,H*1.3);BX=(W-BW)/2}addEventListener('resize',size);size();
function riverY(px){return H*(.5+.05*Math.sin(px/W*Math.PI*2-.5))}const RW=()=>Math.max(30,Math.min(46,W*.085));
function rnd(a,b){return a+Math.random()*(b-a)}function station(px,py,shape){return{id:crypto.randomUUID?crypto.randomUUID():Math.random(),x:px,y:py,shape:shape||shapes[Math.floor(Math.random()*3)],pass:[],heat:0,born:t}}
function reset(){t=0;last=0;ended=false;paused=false;moved=0;week=1;capBonus=0;hub=null;hubBonus=0;tunnels=2;riverTaps=0;ferry=false;stations=[];lines=[[],[],[],[]];trains=[];particles=[];const pts=[[.17,.3],[.52,.26],[.83,.36],[.2,.7],[.5,.66],[.82,.73]];pts.forEach((p,i)=>stations.push(station(BX+BW*p[0],H*p[1],shapes[i%3])));lines[0]=[stations[0],stations[1],stations[2]];lines[1]=[stations[3],stations[4],stations[5]];spawnTrain(0);spawnTrain(1);ui();document.getElementById('over').classList.remove('show');document.body.classList.remove('begun')}
function spawnTrain(li){let L=lines[li];if(L.length>1)trains.push({li,seg:0,p:0,dir:1,load:[],cap:6+capBonus})}
let shownMoved=0;function ui(){document.getElementById('moved').textContent=moved;let d=Math.floor((t%22)/22*7)%7;document.getElementById('day').textContent=days[d];document.getElementById('hand').style.transform=`rotate(${(t%22)/22*360}deg)`;document.getElementById('tunnels').textContent=tunnels;document.getElementById('week').textContent=week;document.getElementById('pause').textContent=paused?'▶':'Ⅱ';document.getElementById('pause').setAttribute('aria-label',paused?'resume':'pause');[...tray.children].forEach((b,i)=>b.classList.toggle('used',lines[i].length>1))}
const tray=document.getElementById('tray');cols.forEach((c,i)=>{let b=document.createElement('button');b.className='swatch'+(!i?' on':'');b.setAttribute('aria-label','line '+(i+1));b.style.setProperty('--c',c);b.style.animationDelay=(.08+i*.06)+'s';b.onclick=()=>{selected=i;[...tray.children].forEach((q,j)=>q.classList.toggle('on',i===j))};tray.appendChild(b)});document.getElementById('pause').onclick=()=>{paused=!paused;ui()};document.getElementById('again').onclick=reset;document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let u=b.dataset.up;if(u==='car'){capBonus+=2;trains.forEach(q=>q.cap+=2)}else if(u==='engine'){let li=lines.map((l,i)=>({i,n:l.length})).sort((a,b)=>b.n-a.n)[0].i;spawnTrain(li)}else if(u==='hub'){hub=stations.slice().sort((a,b)=>b.pass.length-a.pass.length)[0];hubBonus+=5}else if(u==='tunnel'){tunnels+=2}document.getElementById('upgrade').classList.remove('show');paused=false;ui();tone(390,.12)});
function crossesRiver(a,b){let ya=a.y-riverY(a.x),yb=b.y-riverY(b.x);return ya*yb<0}function nearest(px,py,r=34){let best=null,d=r;for(const s of stations){let n=Math.hypot(s.x-px,s.y-py);if(n<d){best=s;d=n}}return best}
function pos(e){let r=C.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return{x:q.clientX-r.left,y:q.clientY-r.top}}
function down(e){if(paused||ended)return;e.preventDefault();let p=pos(e),s=nearest(p.x,p.y);if(!s&&Math.abs(p.y-riverY(p.x))<RW()/2+14){riverTaps++;if(riverTaps===5){ferry=true;document.getElementById('secret').classList.add('show');setTimeout(()=>document.getElementById('secret').classList.remove('show'),2600);tone(440,.18)}}if(s){drag={start:s,pts:[s],x:p.x,y:p.y};document.body.classList.add('begun')}}
function move(e){if(!drag)return;e.preventDefault();let p=pos(e);drag.x=p.x;drag.y=p.y;let s=nearest(p.x,p.y,29);if(s&&s!==drag.pts.at(-1)){if(!drag.pts.includes(s)||s===drag.start)drag.pts.push(s)}}
function up(e){if(!drag)return;e.preventDefault();let p=e.changedTouches?{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}:pos(e),s=nearest(p.x,p.y,38);if(s&&s!==drag.start){let path=drag.pts;if(path.at(-1)!==s)path.push(s);let need=0;for(let i=0;i<path.length-1;i++)if(crossesRiver(path[i],path[i+1]))need++;if(need>tunnels){tone(95,.18);particles.push({x:s.x,y:s.y,a:1,bad:1});drag=null;return}tunnels-=need;ui();let existing=lines[selected];if(existing.length&&existing.at(-1)===path[0]) lines[selected]=existing.concat(path.slice(1));else if(existing.length&&existing[0]===path[0]) lines[selected]=path.slice().reverse().slice(0,-1).concat(existing);else if(existing.includes(path[0])){let k=existing.indexOf(path[0]),end=path.at(-1),j=existing.indexOf(end);if(j>=0&&j!==k){let a=Math.min(k,j),b=Math.max(k,j),mid=k<j?path:path.slice().reverse();lines[selected]=existing.slice(0,a).concat(mid,existing.slice(b+1))}else lines[selected]=existing.slice(0,k+1).concat(path.slice(1))}else lines[selected]=path;trains=trains.filter(q=>q.li!==selected);spawnTrain(selected);tone(220+selected*55,.05)}drag=null}
C.addEventListener('pointerdown',down);C.addEventListener('pointermove',move);C.addEventListener('pointerup',up);C.addEventListener('pointercancel',()=>drag=null);
let ac;function tone(f,d){try{ac=ac||new(AudioContext);let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.025,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch{}}
function spawnPassenger(){if(!stations.length)return;let s=stations[Math.floor(Math.random()*stations.length)],choices=[...new Set(stations.map(q=>q.shape))].filter(z=>z!==s.shape);if(!choices.length)choices=shapes.filter(z=>z!==s.shape);if(s.pass.length<10)s.pass.push(choices[Math.floor(Math.random()*choices.length)])}
function grow(){let m=Math.max(48,R*4),tries=60;while(tries--){let px=rnd(BX+m,BX+BW-m),py=rnd(150,H-130);if(Math.abs(py-riverY(px))>RW()/2+R*2+12&&stations.every(s=>Math.hypot(s.x-px,s.y-py)>R*6.5)){stations.push(station(px,py));particles.push({x:px,y:py,a:1});tone(300,.08);break}}}
/* octilinear geometry: each hop is a straight run plus one 45deg run */
function hop(a,b,flip){let dx=b.x-a.x,dy=b.y-a.y,m=Math.min(Math.abs(dx),Math.abs(dy)),sx=Math.sign(dx),sy=Math.sign(dy);if(m<2||Math.abs(Math.abs(dx)-Math.abs(dy))<2)return[a,b];let c=flip?{x:a.x+sx*m,y:a.y+sy*m}:{x:b.x-sx*m,y:b.y-sy*m};return[a,c,b]}
function linePts(L){let out=[L[0]];for(let i=0;i<L.length-1;i++){let h=hop(L[i],L[i+1],Math.abs(L[i+1].x-L[i].x)<Math.abs(L[i+1].y-L[i].y));out.push(...h.slice(1))}return out}
function tracePts(P,rad){x.moveTo(P[0].x,P[0].y);for(let i=1;i<P.length-1;i++)x.arcTo(P[i].x,P[i].y,P[i+1].x,P[i+1].y,rad);x.lineTo(P.at(-1).x,P.at(-1).y)}
function segPath(L,seg){let a=L[seg],b=L[seg+1];return hop(a,b,Math.abs(b.x-a.x)<Math.abs(b.y-a.y))}
function pathPoint(L,seg,p){let P=segPath(L,seg),len=[],T=0;for(let i=0;i<P.length-1;i++){let l=Math.hypot(P[i+1].x-P[i].x,P[i+1].y-P[i].y);len.push(l);T+=l}let d=p*T;for(let i=0;i<len.length;i++){if(d<=len[i]||i===len.length-1){let q=len[i]?d/len[i]:0,a=P[i],b=P[i+1];return{x:a.x+(b.x-a.x)*q,y:a.y+(b.y-a.y)*q,ang:Math.atan2(b.y-a.y,b.x-a.x)}}d-=len[i]}}
function update(dt){t+=dt;ui();if(Math.floor(t/22)+1>week){week++;grow();paused=true;document.getElementById('upgrade').classList.add('show');ui()}if(Math.floor(t*1.28)!==Math.floor((t-dt)*1.28))spawnPassenger();if(Math.floor(t/9)!==Math.floor((t-dt)/9)&&stations.length<14)grow();for(const tr of trains){let L=lines[tr.li];if(L.length<2)continue;tr.seg=Math.min(tr.seg,L.length-2);tr.p+=dt*.18*tr.dir;if(tr.p>=1||tr.p<=0){let at=tr.p>=1?L[tr.seg+1]:L[tr.seg];tr.p=tr.p>=1?1:0;for(let i=tr.load.length-1;i>=0;i--){if(tr.load[i]===at.shape){tr.load.splice(i,1);moved++;particles.push({x:at.x,y:at.y,a:1});ui()}}for(let i=at.pass.length-1;i>=0;i--){if(at.pass[i]!==at.shape&&L.some(s=>s.shape===at.pass[i])&&tr.load.length<tr.cap){tr.load.push(at.pass.splice(i,1)[0])}}if(tr.p>=1){if(tr.seg<L.length-2){tr.seg++;tr.p=0}else tr.dir=-1}else{if(tr.seg>0){tr.seg--;tr.p=1}else tr.dir=1}}}for(const s of stations){s.heat+=(s.pass.length>=7?dt:-dt*1.8);s.heat=Math.max(0,s.heat);if(s.heat>limit(s)){ended=true;document.getElementById('final').textContent=moved;document.getElementById('over').classList.add('show');tone(105,.7)}}particles.forEach(p=>{p.a-=dt*.8});particles=particles.filter(p=>p.a>0)}
function limit(s){return s===hub?7+hubBonus:7}
function shape(s,xx,yy,r,fill=true){x.beginPath();if(s==='circle')x.arc(xx,yy,r,0,Math.PI*2);else if(s==='square')x.rect(xx-r*.9,yy-r*.9,r*1.8,r*1.8);else if(s==='triangle'){x.moveTo(xx,yy-r*1.2);x.lineTo(xx+r*1.12,yy+r*.8);x.lineTo(xx-r*1.12,yy+r*.8);x.closePath()}else{x.moveTo(xx,yy-r*1.25);x.lineTo(xx+r*1.1,yy);x.lineTo(xx,yy+r*1.25);x.lineTo(xx-r*1.1,yy);x.closePath()}fill?x.fill():x.stroke()}
function riverPath(off=0){x.beginPath();for(let px=-20;px<=W+20;px+=8){let y=riverY(px)+off;px<=-20?x.moveTo(px,y):x.lineTo(px,y)}}
function river(){let w=RW();x.lineCap='butt';x.strokeStyle='rgba(70,104,104,.12)';x.lineWidth=w+4;riverPath(2);x.stroke();x.strokeStyle='#c4dcdc';x.lineWidth=w;riverPath();x.stroke();x.strokeStyle='#d3e6e5';x.lineWidth=w-5;riverPath(-1);x.stroke();x.strokeStyle='rgba(255,255,255,.45)';x.lineWidth=1.2;x.setLineDash([14,22]);x.lineDashOffset=-t*6;riverPath(-w*.18);x.stroke();x.setLineDash([]);x.lineDashOffset=0}
function ground(){let g=x.createRadialGradient(W*.3,H*.28,8,W*.3,H*.28,Math.max(W,H)*.55);g.addColorStop(0,'rgba(255,255,255,.38)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}
function ferryBoat(){if(!ferry)return;let fx=((t*13)%(W+50))-25,fy=riverY(fx)+Math.sin(t*.8)*4;x.save();x.translate(fx,fy);x.fillStyle='rgba(58,68,64,.12)';x.beginPath();x.ellipse(1,7,11,3,0,0,7);x.fill();x.fillStyle='#f6f1e7';x.strokeStyle='#7f6b56';x.lineWidth=1;x.beginPath();x.moveTo(-8,0);x.lineTo(8,0);x.lineTo(5,5);x.lineTo(-5,5);x.closePath();x.fill();x.stroke();x.fillStyle='#9e684c';x.fillRect(-2,-5,4,5);x.restore()}
function caps(P,c){for(const [e,n] of [[P[0],P[1]],[P.at(-1),P.at(-2)]]){let a=Math.atan2(e.y-n.y,e.x-n.x),ex=e.x+Math.cos(a)*R*1.9,ey=e.y+Math.sin(a)*R*1.9;x.strokeStyle=c;x.lineWidth=LW;x.lineCap='butt';x.beginPath();x.moveTo(e.x,e.y);x.lineTo(ex,ey);x.stroke();x.beginPath();x.moveTo(ex-Math.sin(a)*R*.95,ey+Math.cos(a)*R*.95);x.lineTo(ex+Math.sin(a)*R*.95,ey-Math.cos(a)*R*.95);x.stroke()}}

function draw(){x.clearRect(0,0,W,H);x.fillStyle='#efebe0';x.fillRect(0,0,W,H);ground();river();ferryBoat();let rad=R*1.4;for(let li=0;li<lines.length;li++){let L=lines[li];if(L.length<2)continue;let P=linePts(L);x.lineJoin='round';x.lineCap='round';x.strokeStyle='rgba(58,62,56,.14)';x.lineWidth=LW+3;x.save();x.translate(0,2);x.beginPath();tracePts(P,rad);x.stroke();x.restore();caps(P,cols[li]);x.lineCap='round';x.strokeStyle=cols[li];x.lineWidth=LW;x.beginPath();tracePts(P,rad);x.stroke();tunnelsOver(P,cols[li])}if(drag){let pts=drag.pts.concat([{x:drag.x,y:drag.y}]);x.strokeStyle=cols[selected];x.globalAlpha=.75;x.lineWidth=LW;x.lineCap='round';x.lineJoin='round';x.beginPath();tracePts(linePts(pts),rad);x.stroke();x.globalAlpha=1}for(const s of stations){let age=Math.max(0,t-s.born),k=Math.min(1,age/.5),ss=1-Math.pow(1-k,3)*Math.cos(k*9)*.9;ss=age<.5?Math.max(.1,ss):1;x.save();x.translate(s.x,s.y);x.scale(ss,ss);x.translate(-s.x,-s.y);if(s===hub){x.strokeStyle='#3a403d';x.lineWidth=2;x.beginPath();x.arc(s.x,s.y,R*1.75,0,7);x.stroke()}x.fillStyle='rgba(54,60,56,.18)';x.beginPath();x.ellipse(s.x+1,s.y+R*.35,R*1.15,R*.62,0,0,7);x.fill();x.fillStyle='#fbf9f2';x.strokeStyle='#2c3331';x.lineWidth=R*.3;shape(s.shape,s.x,s.y,R,true);shape(s.shape,s.x,s.y,R,false);if(s.heat>0){let f=Math.min(1,s.heat/limit(s));x.strokeStyle='rgba(44,51,49,.12)';x.lineWidth=R*.42;x.beginPath();x.arc(s.x,s.y,R*2.05,0,7);x.stroke();x.strokeStyle='#d64b43';x.lineCap='butt';x.beginPath();x.arc(s.x,s.y,R*2.05,-Math.PI/2,-Math.PI/2+f*Math.PI*2);x.stroke()}let right=s.x<W-R*8;s.pass.forEach((p,i)=>{let row=Math.floor(i/5),col=i%5,px=right?s.x+R*1.85+col*R*.95:s.x-R*1.85-col*R*.95,py=s.y-R*.5+row*R*1;x.fillStyle='#2c3331';shape(p,px,py,R*.34,true)});x.restore()}for(const tr of trains){let L=lines[tr.li];if(L.length<2)continue;let p=pathPoint(L,tr.seg,tr.p),tw=R*2.6,th=R*1.3;x.save();x.translate(p.x,p.y);x.rotate(p.ang);x.fillStyle='rgba(40,46,43,.2)';x.beginPath();x.roundRect(-tw/2+1,-th/2+2,tw,th,2.5);x.fill();x.fillStyle=cols[tr.li];x.beginPath();x.roundRect(-tw/2,-th/2,tw,th,2.5);x.fill();x.fillStyle='rgba(255,255,255,.28)';x.fillRect(-tw/2+2,-th/2+1,tw-4,1.2);x.fillStyle='#fff';tr.load.slice(0,6).forEach((q,i)=>{let c=i%3,r=Math.floor(i/3);shape(q,-tw/2+R*.45+c*R*.7,-th/2+R*.33+r*R*.52,R*.17,true)});x.restore()}particles.forEach(p=>{x.strokeStyle=p.bad?`rgba(214,75,67,${p.a})`:`rgba(60,70,66,${p.a*.6})`;x.lineWidth=1.5;x.beginPath();x.arc(p.x,p.y,R*1.2+(1-Math.pow(p.a,2))*R*2.2,0,7);x.stroke()})}
